<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>スレスパ2 全カード推測ゲーム (Spiredle 2 JP)</title>
  <style>
    :root {
      --bg: #13161f;
      --panel: #1f2433;
      --text: #eef0f6;
      --muted: #98a0b8;
      --correct: #2a8553;
      --partial: #c58416;
      --wrong: #383e54;
      --border: #32394f;
    }
    * { box-sizing: border-box; font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif; }
    body {
      margin: 0; padding: 20px 14px; background: var(--bg); color: var(--text);
      display: flex; flex-direction: column; align-items: center; min-height: 100vh;
    }
    h1 { font-size: 1.45rem; margin-bottom: 4px; letter-spacing: 0.04em; text-align: center; }
    p.sub { color: var(--muted); font-size: 0.88rem; margin-top: 0; margin-bottom: 16px; text-align: center; }
    .filter-bar {
      display: flex; gap: 8px; align-items: center; margin-bottom: 12px; font-size: 0.85rem; color: var(--muted);
    }
    select {
      padding: 8px 10px; border-radius: 6px; border: 1px solid var(--border);
      background: var(--panel); color: var(--text); font-size: 0.9rem;
    }
    .controls {
      position: relative; width: 100%; max-width: 680px; display: flex; gap: 8px; margin-bottom: 14px;
    }
    .btn-group { display: flex; gap: 8px; }
    input {
      flex: 1; padding: 12px 14px; font-size: 16px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--panel); color: var(--text); outline: none;
    }
    input:focus { border-color: #6c8cff; }
    button {
      padding: 12px 16px; font-size: 0.92rem; font-weight: bold; border: none; border-radius: 8px;
      background: #4e6ef2; color: #fff; cursor: pointer; white-space: nowrap;
    }
    button:hover { background: #3b5bdb; }
    button.secondary { background: #383f54; }
    button.secondary:hover { background: #475069; }
    .suggestions {
      position: absolute; top: 50px; left: 0; right: 0; background: #262c3d;
      border: 1px solid var(--border); border-radius: 8px; max-height: 230px; overflow-y: auto; z-index: 10;
      box-shadow: 0 8px 20px rgba(0,0,0,0.45);
    }
    .suggestion-item {
      padding: 11px 14px; cursor: pointer; display: flex; justify-content: space-between; font-size: 0.95rem;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .suggestion-item:hover { background: #374059; }
    .suggestion-meta { color: var(--muted); font-size: 0.8rem; }
    .status { margin-bottom: 14px; font-weight: bold; min-height: 24px; text-align: center; font-size: 0.95rem; }
    .board { width: 100%; max-width: 780px; }
    table { width: 100%; border-collapse: separate; border-spacing: 5px; text-align: center; table-layout: fixed; }
    th { font-size: 0.78rem; color: var(--muted); padding-bottom: 4px; }
    td {
      padding: 11px 6px; border-radius: 6px; font-size: 0.88rem; font-weight: bold;
      background: var(--wrong); word-break: keep-all; overflow-wrap: break-word; line-height: 1.3;
    }
    td.correct { background: var(--correct); }
    td.partial { background: var(--partial); }
    .legend {
      display: flex; gap: 14px; font-size: 0.78rem; color: var(--muted); margin-top: 20px; flex-wrap: wrap; justify-content: center;
    }
    .badge { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: middle; margin-right: 4px; }

    @media (max-width: 600px) {
      body { padding: 14px 8px; }
      h1 { font-size: 1.25rem; }
      p.sub { font-size: 0.8rem; margin-bottom: 12px; }
      .controls { flex-direction: column; }
      .btn-group { width: 100%; }
      .btn-group button { flex: 1; padding: 12px 8px; }
      table { border-spacing: 3px; }
      th { font-size: 0.65rem; }
      td { padding: 8px 2px; font-size: 0.72rem; border-radius: 4px; }
      th:nth-child(5), td:nth-child(5) { width: 11%; }
    }
  </style>
</head>
<body>

  <h1>スレスパ2 全カード推測ゲーム</h1>
  <p class="sub">Slay the Spire 2 の全カードを6回以内に当てよう！</p>

  <div class="filter-bar">
    <label for="charFilter">出題対象:</label>
    <select id="charFilter">
      <option value="ALL">すべて（全キャラ＋無色）</option>
      <option value="アイアンクラッド">アイアンクラッド</option>
      <option value="サイレント">サイレント</option>
      <option value="ディフェクト">ディフェクト</option>
      <option value="リージェント">リージェント</option>
      <option value="ネクロバインダー">ネクロバインダー</option>
      <option value="無色">無色・その他</option>
    </select>
  </div>

  <div class="controls">
    <input type="text" id="cardInput" placeholder="カードデータを読み込み中..." autocomplete="off" disabled>
    <div class="btn-group">
      <button id="guessBtn">回答</button>
      <button id="resetBtn" class="secondary">次の問題</button>
    </div>
    <div id="suggestions" class="suggestions" style="display:none;"></div>
  </div>

  <div class="status" id="status">全カードデータを取得しています...</div>

  <div class="board">
    <table>
      <thead>
        <tr>
          <th>カード名</th>
          <th>キャラ</th>
          <th>タイプ</th>
          <th>レアリティ</th>
          <th>コスト</th>
          <th>キーワード・要素</th>
        </tr>
      </thead>
      <tbody id="boardBody"></tbody>
    </table>
  </div>

  <div class="legend">
    <span><i class="badge" style="background:var(--correct)"></i>完全一致</span>
    <span><i class="badge" style="background:var(--partial)"></i>一部一致（キーワード）</span>
    <span><i class="badge" style="background:var(--wrong)"></i>不一致（▲▼は正解のコスト高低）</span>
  </div>

<script>
const FALLBACK_CARDS = [
  { name: "強打", char: "アイアンクラッド", type: "アタック", rarity: "初期", cost: 2, kw: ["弱体"] },
  { name: "悪魔化", char: "アイアンクラッド", type: "パワー", rarity: "レア", cost: 3, kw: ["筋力"] },
  { name: "無力化", char: "サイレント", type: "アタック", rarity: "初期", cost: 0, kw: ["脱力"] },
  { name: "触媒", char: "サイレント", type: "スキル", rarity: "アンコモン", cost: 1, kw: ["毒", "廃棄"] },
  { name: "ザップ", char: "ディフェクト", type: "スキル", rarity: "初期", cost: 1, kw: ["ライトニング"] },
  { name: "ビッグバン", char: "リージェント", type: "スキル", rarity: "レア", cost: 0, kw: ["スター", "鍛造", "ドロー", "廃棄"] },
  { name: "根絶", char: "ネクロバインダー", type: "アタック", rarity: "アンコモン", cost: 1, kw: ["破滅"] },
  { name: "神格化", char: "無色", type: "スキル", rarity: "レア", cost: 2, kw: ["廃棄"] }
];

const CHAR_MAP = {
  ironclad: "アイアンクラッド",
  silent: "サイレント",
  defect: "ディフェクト",
  regent: "リージェント",
  necrobinder: "ネクロバインダー",
  colorless: "無色"
};

const TYPE_MAP = {
  Attack: "アタック",
  Skill: "スキル",
  Power: "パワー",
  Status: "状態異常",
  Curse: "呪い"
};

const RARITY_MAP = {
  Basic: "初期",
  Common: "コモン",
  Uncommon: "アンコモン",
  Rare: "レア",
  Ancient: "エンシェント",
  Event: "イベント",
  Quest: "クエスト",
  Token: "トークン",
  Status: "状態異常",
  Curse: "呪い"
};

let ALL_CARDS = [];
let pool = [];
let target = null;
let guesses = [];
let gameOver = false;
const MAX_GUESSES = 6;

const filterEl = document.getElementById("charFilter");
const inputEl = document.getElementById("cardInput");
const suggEl = document.getElementById("suggestions");
const boardBody = document.getElementById("boardBody");
const statusEl = document.getElementById("status");

async function loadAllCards() {
  try {
    const res = await fetch("https://spire-codex.com");
    if (!res.ok) throw new Error("API error");
    const data = await res.json();

    const seen = new Set();
    ALL_CARDS = data
      .filter(c => c.name && !["Status", "Curse"].includes(c.type) && !["Status", "Curse", "Token"].includes(c.rarity))
      .map(c => {
        const charName = CHAR_MAP[(c.color || "").toLowerCase()] || "無色";
        let displayName = c.name;
        if (seen.has(displayName)) {
          displayName = `${c.name}(${charName})`;
        }
        seen.add(displayName);

        let costVal = 0;
        if (c.is_x_cost || c.cost === -1 || c.cost === "X") {
          costVal = -1;
        } else if (typeof c.cost === "number") {
          costVal = c.cost;
        }

        const kws = Array.isArray(c.keywords) && c.keywords.length > 0 ? c.keywords : ["なし"];

        return {
          name: displayName,
          char: charName,
          type: TYPE_MAP[c.type] || c.type || "不明",
          rarity: RARITY_MAP[c.rarity] || c.rarity || "その他",
          cost: costVal,
          kw: kws
        };
      });

    if (ALL_CARDS.length < 20) throw new Error("Insufficient data");
  } catch (e) {
    ALL_CARDS = [...FALLBACK_CARDS];
  }

  inputEl.placeholder = "カード名を入力（ひらがな・カタカナ・漢字）";
  initGame();
}

function initGame() {
  const selectedChar = filterEl.value;
  pool = selectedChar === "ALL" ? [...ALL_CARDS] : ALL_CARDS.filter(c => c.char === selectedChar);
  if (pool.length === 0) pool = [...ALL_CARDS];

  target = pool[Math.floor(Math.random() * pool.length)];
  guesses = [];
  gameOver = false;
  boardBody.innerHTML = "";
  inputEl.value = "";
  inputEl.disabled = false;
  statusEl.textContent = `残り回答数: ${MAX_GUESSES}回（収録数: ${pool.length}枚）`;
  suggEl.style.display = "none";
}

function renderSuggestions(query) {
  const q = query.trim();
  if (!q) {
    suggEl.style.display = "none";
    return;
  }
  const matches = pool
    .filter(c => c.name.includes(q) && !guesses.some(g => g.name === c.name))
    .slice(0, 30);

  if (matches.length === 0) {
    suggEl.style.display = "none";
    return;
  }
  suggEl.innerHTML = matches.map(c =>
    `<div class="suggestion-item" data-name="${c.name}">
      <span>${c.name}</span>
      <span class="suggestion-meta">${c.char} / ${c.type}</span>
    </div>`
  ).join("");
  suggEl.style.display = "block";
}

suggEl.addEventListener("click", (e) => {
  const item = e.target.closest(".suggestion-item");
  if (item) {
    inputEl.value = item.dataset.name;
    suggEl.style.display = "none";
    submitGuess();
  }
});

inputEl.addEventListener("input", () => renderSuggestions(inputEl.value));
inputEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    suggEl.style.display = "none";
    submitGuess();
  }
});

document.addEventListener("click", (e) => {
  if (!e.target.closest(".controls")) suggEl.style.display = "none";
});

filterEl.addEventListener("change", initGame);

function submitGuess() {
  if (gameOver) return;
  const val = inputEl.value.trim();
  const card = pool.find(c => c.name === val) || pool.find(c => c.name.includes(val));
  if (!card) {
    statusEl.textContent = "現在の出題対象にあるカード名を候補から選んでください。";
    return;
  }
  if (guesses.some(g => g.name === card.name)) {
    statusEl.textContent = "そのカードは既に回答済みです。";
    return;
  }

  guesses.push(card);
  inputEl.value = "";
  appendRow(card);

  if (card.name === target.name) {
    gameOver = true;
    inputEl.disabled = true;
    statusEl.textContent = `🎉 正解！「${target.name}」を ${guesses.length} 回で当てました！`;
  } else if (guesses.length >= MAX_GUESSES) {
    gameOver = true;
    inputEl.disabled = true;
    statusEl.textContent = `💀 ゲームオーバー！正解は「${target.name}」でした。`;
  } else {
    statusEl.textContent = `残り回答数: ${MAX_GUESSES - guesses.length}回（収録数: ${pool.length}枚）`;
  }
}

function appendRow(card) {
  const tr = document.createElement("tr");

  const nameCls = card.name === target.name ? "correct" : "";
  const charCls = card.char === target.char ? "correct" : "";
  const typeCls = card.type === target.type ? "correct" : "";
  const rarityCls = card.rarity === target.rarity ? "correct" : "";

  let costCls = "";
  let costText = card.cost === -1 ? "X" : card.cost;
  if (card.cost === target.cost) {
    costCls = "correct";
  } else if (card.cost !== -1 && target.cost !== -1) {
    costText += card.cost < target.cost ? " ▲" : " ▼";
  }

  const sameKw = card.kw.length === target.kw.length && card.kw.every(k => target.kw.includes(k));
  const partKw = card.kw.some(k => target.kw.includes(k));
  const kwCls = sameKw ? "correct" : (partKw ? "partial" : "");

  tr.innerHTML = `
    <td class="${nameCls}">${card.name}</td>
    <td class="${charCls}">${card.char}</td>
    <td class="${typeCls}">${card.type}</td>
    <td class="${rarityCls}">${card.rarity}</td>
    <td class="${costCls}">${costText}</td>
    <td class="${kwCls}">${card.kw.join(" / ")}</td>
  `;
  boardBody.prepend(tr);
}

document.getElementById("guessBtn").addEventListener("click", submitGuess);
document.getElementById("resetBtn").addEventListener("click", initGame);

loadAllCards();
</script>
</body>
</html>
